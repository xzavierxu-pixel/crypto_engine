baseline:
  artifact_dir: execution_engine/deploy/baseline
  settings_path: config/settings.yaml
  model_file: lightgbm.binary.pkl
  calibrator_file: none.binary.pkl
  manifest_file: artifact_manifest.json

runtime:
  mode: paper
  timezone: UTC
  audit_log: artifacts/logs/execution_engine/live.jsonl
  summary_dir: artifacts/logs/execution_engine/summaries
  idempotency_store_path: artifacts/state/execution_engine/idempotency.json

binance:
  base_url: https://api.binance.com
  symbol: BTCUSDT
  one_minute_interval: 1m
  one_second_interval: 1s
  request_timeout_seconds: 5
  lookback_minutes: 360
  require_closed_kline: true
  max_clock_skew_seconds: 2
  cache_path: artifacts/state/execution_engine/binance_cache.parquet
  require_agg_trade_through_last_second: true
  max_agg_trade_lag_seconds: 2
  agg_trade_wait_seconds: 8

schedule:
  interval_minutes: 5
  trigger_delay_seconds: 68
  max_data_wait_seconds: 20
  prewarm_seconds_before_trigger: 45

thresholds:
  t_up: null
  t_down: null

polymarket:
  host: https://clob.polymarket.com
  gamma_base_url: https://gamma-api.polymarket.com
  chain_id: 137
  private_key_env: POLYMARKET_PRIVATE_KEY
  api_key_env: CLOB_API_KEY
  api_secret_env: CLOB_SECRET
  api_passphrase_env: CLOB_PASS_PHRASE
  signature_type: null
  funder: null
  timeout_seconds: 5
  max_pages: 3

orders:
  enabled: false
  mode: paper
  first:
    price_cap: 0.35
    offset: 0.0
    size: 8.0
  second:
    price_cap: 0.3
    offset: 0.0
    size: 0.0
  min_price: 0.01
  max_price: 0.99
  tick_size_default: 0.01
  on_invalid_second_order: skip

execution_edge:
  enabled: true
  min_edge: 0.08
  max_buy_price: 0.35
  max_spread: 0.08
  max_order_notional: 4.0
  size_to_max_notional: true
  apply_to_first_leg: true
  apply_to_second_leg: true

guards:
  require_market_accepting_orders: true
  require_best_bid: true
  max_orders_per_window: 1
  enforce_idempotency: true

paper_test:
  max_duration_minutes: 60
  stop_when_pnl_gt: 25.0
  report_to_user: true
