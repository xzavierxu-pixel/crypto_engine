experiment_id: 20260611_reversal_second_round_diagnostics
mode: prediction_stack_price_edge_correctness_selector_diagnostics
baseline_experiment: artifacts/data_v2/experiments/20260521_regime_reversal_second_agg_features
price_store: artifacts/data_v2/polymarket_prices/btc_updown_5m_first_price.parquet
output_dir: artifacts/data_v2/reports/reversal_hybrid/20260611_reversal_second_round_diagnostics

objective:
  optimize_metric: accepted_sample_accuracy
  min_coverage: 0.70
  target_accepted_sample_accuracy: 0.75

prediction_stack_experiments:
  - artifacts/data_v2/experiments/20260521_baseline_coverage_090
  - artifacts/data_v2/experiments/20260521_regime_reversal_second_agg_features
  - artifacts/data_v2/experiments/20260605_regime_reversal_catboost_regime_fm_reversal
  - artifacts/data_v2/experiments/20260605_regime_reversal_rank_blend
  - artifacts/data_v2/experiments/20260605_regime_reversal_reversal_weight_boost
  - artifacts/data_v2/experiments/20260611_first_minute_follow_reversal_weight_utility
  - artifacts/data_v2/experiments/20260611_first_minute_follow_utility_no_coverage

feature_set:
  mode: keep_regex
  patterns:
    - "fm_"
    - "ret_1"
    - "return_1s"
    - "return_3s"
    - "return_5s"
    - "slope"
    - "taker"
    - "flow"
    - "imbalance"
    - "pressure"
    - "divergence"
    - "absorption"
    - "exhaustion"
    - "wick"
    - "clv"
    - "close_location"

threshold_search:
  hard_constraint: coverage_only
  t_up_min: 0.50
  t_up_max: 0.80
  t_down_min: 0.20
  t_down_max: 0.50
  step: 0.01

price_threshold_search:
  hard_constraint: coverage_only
  t_up_min: 0.50
  t_up_max: 0.95
  t_down_min: 0.05
  t_down_max: 0.50
  step: 0.02
  max_seconds_from_t0: [60, 90, 300]

model:
  n_estimators: 300
  learning_rate: 0.03
  num_leaves: 15
  min_child_samples: 200
  subsample: 0.85
  colsample_bytree: 0.75
  reg_alpha: 2.0
  reg_lambda: 20.0
  random_state: 20260611
