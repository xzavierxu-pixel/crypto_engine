experiment_id: 20260611_reversal_auxiliary_ablation
mode: reversal_precision_auxiliary_model_and_feature_ablation
baseline_experiment: artifacts/data_v2/experiments/20260521_regime_reversal_second_agg_features
output_dir: artifacts/data_v2/reports/reversal_hybrid/20260611_reversal_auxiliary_ablation

objective:
  optimize_metric: selection_score
  min_coverage: 0.70

threshold_search:
  hard_constraint: coverage_only
  reversal_risk_thresholds: [0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60]
  base_bands: [0.03, 0.05, 0.07, 0.10, 0.15, 0.20, 0.50]

model:
  type: lightgbm_lgbmclassifier
  n_estimators: 450
  learning_rate: 0.035
  num_leaves: 31
  min_child_samples: 80
  subsample: 0.85
  colsample_bytree: 0.75
  reg_alpha: 0.5
  reg_lambda: 8.0
  random_state: 20260611

feature_variants:
  - name: all_features
    mode: all
  - name: minus_broad_volatility
    mode: drop_regex
    patterns:
      - "(^|_)rv(_|$)"
      - "rvar"
      - "realized"
      - "volatility"
      - "mean_abs"
      - "max_abs"
      - "abs_ret"
      - "range"
      - "true_range"
      - "htf_rv"
  - name: impulse_flow_subset
    mode: keep_regex
    patterns:
      - "fm_"
      - "ret_1"
      - "return_1s"
      - "return_3s"
      - "return_5s"
      - "slope"
      - "taker"
      - "flow"
      - "imbalance"
      - "pressure"
      - "divergence"
      - "absorption"
      - "exhaustion"
      - "wick"
      - "clv"
      - "close_location"

acceptance:
  require_selection_score_gt_baseline: true
  require_positive_utility: true
  require_accepted_sample_accuracy_gt: 0.50
