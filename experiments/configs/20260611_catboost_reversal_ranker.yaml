experiment_id: 20260611_catboost_reversal_ranker
mode: isolated_catboost_ranker_variants
baseline_experiment: artifacts/data_v2/experiments/20260521_regime_reversal_second_agg_features
output_dir: artifacts/data_v2/reports/reversal_hybrid/20260611_catboost_reversal_ranker

objective:
  optimize_metric: accepted_sample_accuracy
  min_coverage: 0.70
  target_accepted_sample_accuracy: 0.75

threshold_search:
  hard_constraint: coverage_only
  t_up_min: 0.50
  t_up_max: 0.80
  t_down_min: 0.20
  t_down_max: 0.50
  step: 0.01

model:
  iterations: 350
  learning_rate: 0.03
  depth: 4
  l2_leaf_reg: 20.0
  random_strength: 1.0
  bootstrap_type: Bernoulli
  subsample: 0.85
  loss_function: Logloss
  eval_metric: Logloss
  allow_writing_files: false
  verbose: false
  random_seed: 20260611

feature_set:
  patterns:
    - "fm_"
    - "ret_1"
    - "return_1s"
    - "return_3s"
    - "return_5s"
    - "slope"
    - "taker"
    - "flow"
    - "imbalance"
    - "pressure"
    - "divergence"
    - "absorption"
    - "exhaustion"
    - "wick"
    - "clv"
    - "close_location"

variants:
  - name: catboost_impulse_final
    model_target: final_direction
  - name: catboost_impulse_follow_relative
    model_target: follow_relative
