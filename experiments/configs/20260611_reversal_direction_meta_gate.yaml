experiment_id: 20260611_reversal_direction_meta_gate
mode: impulse_flow_subset_direction_meta_gate
model_target: follow_relative
baseline_experiment: artifacts/data_v2/experiments/20260521_regime_reversal_second_agg_features
follow_experiment: artifacts/data_v2/experiments/20260611_first_minute_follow_reversal_weight_utility
output_dir: artifacts/data_v2/reports/reversal_hybrid/20260611_reversal_direction_meta_gate

objective:
  optimize_metric: reversal_accepted_accuracy
  min_coverage: 0.70
  min_continuation_accepted_accuracy: 0.90
  min_reversal_accepted_accuracy: 0.50

threshold_search:
  hard_constraint: coverage_and_continuation
  decision_mode: first_minute_relative
  t_follow_values: [0.50, 0.52, 0.54, 0.56, 0.58, 0.60, 0.62, 0.64, 0.66, 0.68, 0.70]
  t_reversal_values: [0.02, 0.05, 0.08, 0.10, 0.12, 0.15, 0.18, 0.20, 0.22, 0.25, 0.28, 0.30, 0.32, 0.34, 0.36, 0.38, 0.40, 0.42, 0.44, 0.46, 0.48]

model:
  type: catboost_classifier
  iterations: 700
  learning_rate: 0.035
  depth: 6
  l2_leaf_reg: 12.0
  random_strength: 0.5
  bootstrap_type: Bernoulli
  subsample: 0.85
  allow_writing_files: false
  verbose: false
  random_state: 20260611

feature_variant:
  name: impulse_flow_subset
  mode: keep_regex
  patterns:
    - "fm_"
    - "ret_1"
    - "return_1s"
    - "return_3s"
    - "return_5s"
    - "slope"
    - "taker"
    - "flow"
    - "imbalance"
    - "pressure"
    - "divergence"
    - "absorption"
    - "exhaustion"
    - "wick"
    - "clv"
    - "close_location"
