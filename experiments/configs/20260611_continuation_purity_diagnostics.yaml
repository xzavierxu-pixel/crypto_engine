experiment_id: 20260611_continuation_purity_diagnostics
mode: continuation_purity_and_hybrid_fill_search
baseline_experiment: artifacts/data_v2/experiments/20260521_regime_reversal_second_agg_features
output_dir: artifacts/data_v2/reports/reversal_hybrid/20260611_continuation_purity_diagnostics

objective:
  optimize_metric: accepted_sample_accuracy
  min_coverage: 0.70
  target_accepted_sample_accuracy: 0.75

feature_set:
  patterns:
    - "fm_"
    - "ret_1"
    - "return_1s"
    - "return_3s"
    - "return_5s"
    - "slope"
    - "taker"
    - "flow"
    - "imbalance"
    - "pressure"
    - "divergence"
    - "absorption"
    - "exhaustion"
    - "wick"
    - "clv"
    - "close_location"

catboost_model:
  iterations: 400
  learning_rate: 0.025
  depth: 5
  l2_leaf_reg: 24.0
  random_strength: 1.0
  bootstrap_type: Bernoulli
  subsample: 0.85
  loss_function: Logloss
  eval_metric: Logloss
  allow_writing_files: false
  verbose: false
  random_seed: 20260611

continuation_model:
  n_estimators: 500
  learning_rate: 0.03
  num_leaves: 7
  min_child_samples: 120
  subsample: 0.85
  colsample_bytree: 0.75
  reg_alpha: 2.0
  reg_lambda: 20.0
  random_state: 20260611

continuation_only_search:
  cutoffs: [0.35, 0.375, 0.40, 0.425, 0.45, 0.475, 0.50, 0.525, 0.55, 0.575, 0.60, 0.625, 0.65, 0.675, 0.70]

hybrid_fill_search:
  catboost_confidences: [0.10, 0.125, 0.15, 0.175, 0.20, 0.225, 0.25, 0.275, 0.30, 0.325, 0.35]
  continuation_cutoffs: [0.35, 0.375, 0.40, 0.425, 0.45, 0.475, 0.50, 0.525, 0.55, 0.575, 0.60, 0.625, 0.65, 0.675, 0.70]
