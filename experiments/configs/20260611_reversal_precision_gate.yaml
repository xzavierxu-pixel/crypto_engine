experiment_id: 20260611_reversal_precision_gate
mode: reversal_precision_override_gate_on_impulse_flow_subset
baseline_experiment: artifacts/data_v2/experiments/20260521_regime_reversal_second_agg_features
follow_experiment: artifacts/data_v2/experiments/20260611_first_minute_follow_reversal_weight_utility
output_dir: artifacts/data_v2/reports/reversal_hybrid/20260611_reversal_precision_gate

objective:
  optimize_metric: reversal_accepted_accuracy
  min_coverage: 0.70
  min_continuation_accepted_accuracy: 0.90
  min_reversal_accepted_accuracy: 0.50

threshold_search:
  hard_constraint: coverage_and_continuation
  override_thresholds: [0.40, 0.45, 0.50, 0.55]
  max_base_confidences: [0.15, 0.20]
  min_first_minute_abs_returns: [0.0]
  min_follow_reversal_probabilities: [0.0, 0.45]
  low_risk_filter_thresholds: [0.50, 0.60]
  low_follow_filter_thresholds: [0.45, 0.55]
  max_continuation_risks: [0.50, 0.55, 0.60, 1.0]
  max_continuation_follow_reversal_probabilities: [0.55, 0.65, 1.0]
  include_abstains: [false, true]

model:
  type: lightgbm_lgbmclassifier
  train_scope: base_continuation
  n_estimators: 450
  learning_rate: 0.035
  num_leaves: 31
  min_child_samples: 80
  subsample: 0.85
  colsample_bytree: 0.75
  reg_alpha: 0.5
  reg_lambda: 8.0
  random_state: 20260611

feature_variant:
  name: impulse_flow_subset
  mode: keep_regex
  patterns:
    - "fm_"
    - "ret_1"
    - "return_1s"
    - "return_3s"
    - "return_5s"
    - "slope"
    - "taker"
    - "flow"
    - "imbalance"
    - "pressure"
    - "divergence"
    - "absorption"
    - "exhaustion"
    - "wick"
    - "clv"
    - "close_location"
