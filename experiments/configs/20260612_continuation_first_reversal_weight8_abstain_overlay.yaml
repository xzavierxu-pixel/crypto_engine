experiment_id: 20260612_continuation_first_reversal_weight8_abstain_overlay
mode: continuation_first_reversal_fallback_overlay
baseline_experiment: artifacts/data_v2/experiments/20260521_regime_reversal_second_agg_features
output_dir: artifacts/data_v2/reports/reversal_hybrid/20260612_continuation_first_reversal_weight8_abstain_overlay

objective:
  optimize_metric: incremental_utility_from_reversal
  min_coverage: 0.70
  hard_constraint: coverage_only
  validation_result_optimistic: true

continuation_expert:
  source: artifacts/data_v2/reports/reversal_hybrid/20260611_catboost_continuation_side_coordinate_search
  thresholds_path: artifacts/data_v2/reports/reversal_hybrid/20260611_catboost_continuation_side_coordinate_search/thresholds.json
  decision_constraint: same_side_first_minute_only
  priority: primary_no_override

reversal_expert:
  source: artifacts/data_v2/reports/reversal_hybrid/20260611_catboost_reversal_sample_weight_search/reversal_weight_8
  sample_weight: 8.0
  decision_constraint: opposite_side_first_minute_only
  residual_policy: continuation_abstain_only

model:
  iterations: 400
  learning_rate: 0.025
  depth: 5
  l2_leaf_reg: 24.0
  random_strength: 1.0
  bootstrap_type: Bernoulli
  subsample: 0.85
  loss_function: Logloss
  eval_metric: Logloss
  allow_writing_files: false
  verbose: false
  random_seed: 20260611

feature_set:
  patterns:
    - "fm_"
    - "ret_1"
    - "return_1s"
    - "return_3s"
    - "return_5s"
    - "slope"
    - "taker"
    - "flow"
    - "imbalance"
    - "pressure"
    - "divergence"
    - "absorption"
    - "exhaustion"
    - "wick"
    - "clv"
    - "close_location"

threshold_search:
  hard_constraint: coverage_only
  residual_scope: continuation_accept_eq_0
  optimize_metric: incremental_utility_from_reversal
  t_up_min: 0.00
  t_up_max: 1.00
  t_down_min: 0.00
  t_down_max: 1.00
  step: 0.01
