experiment_id: 20260611_reversal_rescue_gate
mode: baseline_continuation_reversal_rescue_gate
baseline_experiment: artifacts/data_v2/experiments/20260521_regime_reversal_second_agg_features
follow_experiment: artifacts/data_v2/experiments/20260611_first_minute_follow_reversal_weight_utility
output_dir: artifacts/data_v2/reports/reversal_hybrid/20260611_reversal_rescue_gate

objective:
  optimize_metric: reversal_accepted_accuracy
  min_coverage: 0.70
  min_continuation_accepted_accuracy: 0.90
  min_reversal_accepted_accuracy: 0.50

threshold_search:
  hard_constraint: coverage_and_continuation
  keep_thresholds: [0.02, 0.05, 0.08, 0.10, 0.12, 0.15, 0.18, 0.20, 0.22, 0.25, 0.28, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  reverse_thresholds: [0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90]
  keep_base_reversal: [false, true]
  use_abstains: [false, true]

model:
  type: lightgbm_lgbmclassifier
  n_estimators: 600
  learning_rate: 0.03
  num_leaves: 31
  min_child_samples: 60
  subsample: 0.85
  colsample_bytree: 0.75
  reg_alpha: 0.5
  reg_lambda: 8.0
  random_state: 20260611

feature_variant:
  name: impulse_flow_subset
  mode: keep_regex
  patterns:
    - "fm_"
    - "ret_1"
    - "return_1s"
    - "return_3s"
    - "return_5s"
    - "slope"
    - "taker"
    - "flow"
    - "imbalance"
    - "pressure"
    - "divergence"
    - "absorption"
    - "exhaustion"
    - "wick"
    - "clv"
    - "close_location"
