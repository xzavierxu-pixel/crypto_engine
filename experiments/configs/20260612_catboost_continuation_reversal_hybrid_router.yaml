reversal_expert:
  source: artifacts\data_v2\reports\reversal_hybrid\20260611_catboost_reversal_sample_weight_search\reversal_weight_8
  sample_weight: 8.0
  t_up: 0.45
  t_down: 0.30
  decision_constraint: opposite_side_first_minute_only

expert_model:
  iterations: 400
  learning_rate: 0.025
  depth: 5
  l2_leaf_reg: 24.0
  random_strength: 1.0
  bootstrap_type: Bernoulli
  subsample: 0.85
  loss_function: Logloss
  eval_metric: Logloss
  allow_writing_files: false
  verbose: false
  random_seed: 20260611

gate_model:
