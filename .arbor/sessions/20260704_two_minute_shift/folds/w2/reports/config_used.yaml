experiment_id: 20260704_two_minute_w2
objective:
  min_coverage: 0.7
paths:
  deploy_artifact_dir: execution_engine/deploy/baseline
  feature_manifest: execution_engine/deploy/baseline/artifact_manifest.json
  train_dataset_source: artifacts/data_v2/experiments/20260521_regime_reversal_second_agg_features/development_frame.parquet
  validation_dataset_source: artifacts/data_v2/experiments/20260521_regime_reversal_second_agg_features/validation_frame.parquet
  trades_dir: price_estimator/data/sell_taker_trades_daily
  experiment_dir: .arbor/sessions/20260703_sum_pnl_no_leak/bdev_h2
  target_summary_source: .arbor/sessions/20260704_two_minute_shift/target_reports/target_build_summary.json
  train_dataset: .arbor/sessions/20260704_two_minute_shift/folds/w2/data/train.parquet
  validation_dataset: .arbor/sessions/20260704_two_minute_shift/folds/w2/data/dev.parquet
  models_dir: .arbor/sessions/20260704_two_minute_shift/folds/w2/models
  reports_dir: .arbor/sessions/20260704_two_minute_shift/folds/w2/reports
  predictions_train: .arbor/sessions/20260704_two_minute_shift/folds/w2/reports/predictions_train.parquet
  predictions_calibration: .arbor/sessions/20260704_two_minute_shift/folds/w2/reports/predictions_calibration.parquet
  predictions_validation: .arbor/sessions/20260704_two_minute_shift/folds/w2/reports/predictions_validation.parquet
target:
  selected_side_source: deploy_manifest_threshold_policy
  order_window: until_settlement
  trades_coverage_start: 2026-02-12 00:00:00+00:00
  include_start: true
  include_end: true
  eps: 0.01
  tick_size: 0.01
  min_bid: 0.01
  min_ev_grid:
  - 0.0
  - 0.01
  - 0.02
  - 0.03
  - 0.05
  min_ev_selection_source: calibration
  min_ev_min_order_count: 100
split:
  calibration_tail_days: 7
  timestamp_column: timestamp
features:
  source: split_artifact_feature_columns
  added_columns:
  - selected_side
  - p_up
  - p_side
  - direction_confidence
  - p_bin
  - p_side_bucket
  - market_time_bucket
  categorical_columns:
  - selected_side
  - p_bin
  - p_side_bucket
  - market_time_bucket
  forbidden_columns:
  - target
  - future_close
  - abs_return
  - signed_return
  - stage1_target
  - stage2_target
  - stage1_sample_weight
  - lowest_trade_price_next4
  - lowest_trade_time_next4
  - time_to_lowest_trade_sec
  - target_raw
  - chosen_low_next4
  - chosen_low_trade_time
  - chosen_low
  - correct
  - accepted
  - threshold_accepted
  - predicted_side
  - predicted_outcome
  - chosen_low_reason
model:
  family: hazard_survival_cdf
  hidden_dims:
  - 256
  - 128
  - 64
  dropout:
  - 0.1
  - 0.05
  - 0.0
  hazard:
    tick_size: 0.01
    max_price: 0.85
    smoothness_penalty: 0.01
  q_calibration:
    enabled: false
training:
  batch_size: 512
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0001
  random_seed: 20260704
  num_workers: 0
  device: cuda
  gradient_clip_norm: 5.0
  early_stop_patience: 6
backtest:
  baselines:
  - expected_return
  - fixed_0p50_pside
  - fixed_0p75_pside
  - pay_pside
