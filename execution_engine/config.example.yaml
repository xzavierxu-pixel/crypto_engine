baseline:
  artifact_dir: execution_engine/deploy/baseline
  settings_path: config/settings.yaml
  model_file: null
  calibrator_file: null
  manifest_file: artifact_manifest.json
  active_artifact: full_train
  artifacts:
    split_validation:
      artifact_dir: artifacts/data_v2/experiments/20260605_regime_reversal_rank_blend
    full_train:
      artifact_dir: execution_engine/deploy/baseline
price_estimator:
  enabled: true
  active_artifact: safe_lowest_price_gap
  artifact_dir: execution_engine/deploy/price_estimator_safe_lowest_price_gap
  artifacts:
    q80:
      artifact_dir: execution_engine/deploy/price_estimator_q80
      manifest_file: artifact_manifest.json
      model_file: catboost_q80.cbm
      prediction_column: pred_q80
    safe_lowest_price_gap:
      artifact_dir: execution_engine/deploy/price_estimator_safe_lowest_price_gap
      manifest_file: artifact_manifest.json
      model_file: safe_lowest_price_gap.pt
      prediction_column: p_pred
  manifest_file: artifact_manifest.json
  model_file: safe_lowest_price_gap.pt
  prediction_column: p_pred
  selected_side_column: selected_side
  yes_value: UP
  no_value: DOWN
  round_decimals: 2
  best_ask_offset: 0.01
  fallback_price_mode: limit_config_best_ask_offset
runtime:
  mode: live
  timezone: UTC
  audit_log: artifacts/logs/execution_engine/live.jsonl
  summary_dir: artifacts/logs/execution_engine/summaries
  idempotency_store_path: artifacts/state/execution_engine/idempotency.json
binance:
  base_url: https://api.binance.com
  symbol: BTCUSDT
  one_minute_interval: 1m
  one_second_interval: 1s
  request_timeout_seconds: 5
  lookback_minutes: 360
  require_closed_kline: true
  max_clock_skew_seconds: 2
  cache_path: artifacts/state/execution_engine/binance_cache.parquet
  require_agg_trade_through_last_second: true
  max_agg_trade_lag_seconds: 2
  agg_trade_wait_seconds: 8
schedule:
  interval_minutes: 5
  trigger_delay_seconds: 68
  max_data_wait_seconds: 20
  prewarm_seconds_before_trigger: 45
thresholds:
  t_up: null
  t_down: null
polymarket:
  host: https://clob.polymarket.com
  gamma_base_url: https://gamma-api.polymarket.com
  chain_id: 137
  private_key_env: POLYMARKET_PRIVATE_KEY
  api_key_env: CLOB_API_KEY
  api_secret_env: CLOB_SECRET
  api_passphrase_env: CLOB_PASS_PHRASE
  signature_type: null
  funder: null
  timeout_seconds: 5
  max_pages: 3
orders:
  enabled: true
  mode: live
  first:
    enabled: true
    price_mode: min_safe_gap_price_and_best_ask_offset
    price_cap: 0.65
    offset: 0.01
    best_bid_offset: 0.0
    reference_multiplier: 1.0
    round_decimals: null
    size: 5.0
  second:
    enabled: false
    price_cap: 0.2
    offset: 0.0
    reference_multiplier: 0.25
    round_decimals: 2
    size: 5.0
  min_price: 0.1
  max_price: 0.99
  tick_size_default: 0.01
  on_invalid_second_order: skip
  cancel_unfilled_after_seconds: 60
execution_edge:
  enabled: false
  min_edge: 0.0
  max_buy_price: 0.8
  max_spread: 0.08
  max_order_notional: 5.0
  size_to_max_notional: false
  apply_to_first_leg: true
  apply_to_second_leg: true
guards:
  require_market_accepting_orders: true
  require_best_bid: true
  max_orders_per_window: 2
  enforce_idempotency: true
paper_test:
  max_duration_minutes: 60
  stop_when_pnl_gt: 25.0
  report_to_user: true
