experiment_id: 20260614_quantile_signal_filter

paths:
  deploy_artifact_dir: execution_engine/deploy/baseline
  feature_manifest: artifacts/data_v2/experiments/20260520_polymarket_resolved_extended_history_baseline/artifact_manifest.json
  train_dataset: price_estimator/data/price_estimator_train.parquet
  validation_dataset: price_estimator/data/price_estimator_valid.parquet
  predictions_validation: price_estimator/experiment/20260614_quantile_signal_filter/reports/predictions_validation.parquet
  predictions_train: price_estimator/experiment/20260614_quantile_signal_filter/reports/predictions_train.parquet
  models_dir: price_estimator/experiment/20260614_quantile_signal_filter/models
  reports_dir: price_estimator/experiment/20260614_quantile_signal_filter/reports

target:
  eps: 0.01

sample_filter:
  enabled: true
  mode: accepted_signal
  signal:
    t_up: null
    t_down: null

features:
  source: split_artifact_feature_columns
  added_columns:
    - selected_side
    - p_up
    - p_side
    - direction_confidence
    - p_bin
  categorical_columns:
    - selected_side
    - p_bin
  forbidden_columns:
    - target
    - future_close
    - abs_return
    - signed_return
    - stage1_target
    - stage2_target
    - lowest_trade_price_next4
    - lowest_trade_time_next4
    - time_to_lowest_trade_sec

direction_model:
  p_up_source: deploy_predictions
  join_keys:
    - timestamp
    - decision_time
  p_bin_edges:
    - 0.5
    - 0.55
    - 0.6
    - 0.65
    - 0.7
    - 1.0

model:
  quantiles:
    - 0.50
    - 0.60
    - 0.70
    - 0.80
    - 0.90
  params:
    iterations: 1500
    learning_rate: 0.03
    depth: 6
    l2_leaf_reg: 10
    random_seed: 42
    od_type: Iter
    od_wait: 100
    verbose: 100
    train_dir: price_estimator/experiment/20260614_quantile_signal_filter/models/catboost_info

evaluation:
  coverage_epsilon: 0.01
  crossing_postprocess: row_sort
  strata:
    - selected_side
    - p_bin
    - p_side_bucket
    - time_to_lowest_trade_sec_bucket
    - market_time_bucket
