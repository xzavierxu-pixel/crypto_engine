experiment_id: 20260626_predicted_side_soft_pnl_s0

objective:
  min_direction_coverage: 0.70
  min_order_coverage: 0.70
  calibration_min_order_coverage: 0.72
  target_validation_mean_accepted_pnl: 0.00340
  target_validation_sum_pnl: 17.75
  target_win_loss_ratio: 1.04

metadata:
  deploy_training_mode: offline_validation_bid_policy_experiment
  offline_validation_metric_source: price_estimator/expected_return/experiments/20260619_expected_return_h2_hazard_smooth/reports/summary_metrics.json

paths:
  deploy_artifact_dir: execution_engine/deploy/baseline
  feature_manifest: execution_engine/deploy/baseline/artifact_manifest.json
  train_dataset: price_estimator/expected_return/experiments/20260619_expected_return_trade_coverage_start/data/expected_return_train.parquet
  validation_dataset: price_estimator/expected_return/experiments/20260619_expected_return_trade_coverage_start/data/expected_return_validation.parquet
  experiment_dir: price_estimator/bid_policy/experiments/20260626_predicted_side_soft_pnl_s0
  models_dir: price_estimator/bid_policy/experiments/20260626_predicted_side_soft_pnl_s0/models
  reports_dir: price_estimator/bid_policy/experiments/20260626_predicted_side_soft_pnl_s0/reports
  predictions_train: price_estimator/bid_policy/experiments/20260626_predicted_side_soft_pnl_s0/reports/predictions_train.parquet
  predictions_calibration: price_estimator/bid_policy/experiments/20260626_predicted_side_soft_pnl_s0/reports/predictions_calibration.parquet
  predictions_validation: price_estimator/bid_policy/experiments/20260626_predicted_side_soft_pnl_s0/reports/predictions_validation.parquet

target:
  selected_side_source: deploy_manifest_threshold_policy
  order_window: until_settlement
  trades_coverage_start: 2026-02-12T00:00:00Z
  tick_size: 0.01
  min_bid: 0.01
  theta_candidates:
    absolute: [0.00, 0.01, 0.02, 0.03, 0.05]
    coverage_quantiles: [0.72, 0.75, 0.80, 0.90, 1.00]

split:
  calibration_tail_days: 7
  timestamp_column: timestamp

features:
  source: split_artifact_feature_columns
  added_columns:
    - selected_side
    - p_up
    - p_side
    - direction_confidence
    - p_bin
    - p_side_bucket
    - market_time_bucket
  categorical_columns:
    - selected_side
    - p_bin
    - p_side_bucket
    - market_time_bucket
  forbidden_columns:
    - target
    - future_close
    - abs_return
    - signed_return
    - stage1_target
    - stage2_target
    - lowest_trade_price_next4
    - lowest_trade_time_next4
    - time_to_lowest_trade_sec
    - target_raw
    - chosen_low_next4
    - chosen_low_trade_time
    - chosen_low
    - correct
    - accepted
    - threshold_accepted
    - predicted_side
    - predicted_outcome
    - chosen_low_reason
    - realized_pnl
    - future_trade_price

model:
  family: predicted_side_soft_pnl_mlp
  hidden_dims: [256, 128, 64]
  dropout: [0.10, 0.05, 0.00]
  tau_grid: [0.005, 0.01, 0.02]
  lambda_wrong_grid: [1.0, 1.5, 2.0]
  soft_fill_margin_multiplier: 3.0

training:
  batch_size: 512
  epochs: 24
  learning_rate: 0.001
  weight_decay: 0.0001
  random_seed: 42
  num_workers: 0
  device: auto
  gradient_clip_norm: 5.0
  early_stop_patience: 6

baseline:
  h2_validation_mean_accepted_pnl: 0.0033951798010711555
  h2_validation_sum_pnl: 17.75
  h2_win_loss_ratio: 1.0439
