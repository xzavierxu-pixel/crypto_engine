experiment_id: 20260614_upper_bound_mlp_aug_lagrangian

paths:
  deploy_artifact_dir: execution_engine/deploy/baseline
  feature_manifest: artifacts/data_v2/experiments/20260520_polymarket_resolved_extended_history_baseline/artifact_manifest.json
  train_dataset: price_estimator/data/price_estimator_train.parquet
  validation_dataset: price_estimator/data/price_estimator_valid.parquet
  models_dir: price_estimator/upper_bound_mlp/models
  reports_dir: price_estimator/upper_bound_mlp/reports
  predictions_train: price_estimator/upper_bound_mlp/reports/predictions_train.parquet
  predictions_validation: price_estimator/upper_bound_mlp/reports/predictions_validation.parquet

target:
  column: target_raw
  epsilon: 0.01
  clip_min: 0.000001
  clip_max: 0.999999
  feasibility_tolerance: 0.000001

features:
  source: split_artifact_feature_columns
  added_columns:
    - selected_side
    - p_up
    - p_side
    - direction_confidence
    - p_bin
  categorical_columns:
    - selected_side
    - p_bin
  forbidden_columns:
    - target
    - future_close
    - abs_return
    - signed_return
    - stage1_target
    - stage2_target
    - lowest_trade_price_next4
    - lowest_trade_time_next4
    - time_to_lowest_trade_sec
    - target_raw
    - target_logit

model:
  hidden_dims:
    - 256
    - 128
    - 64
  dropout:
    - 0.10
    - 0.05
    - 0.00
  activation: silu

training:
  batch_size: 512
  epochs: 250
  learning_rate: 0.001
  weight_decay: 0.0001
  random_seed: 42
  num_workers: 0
  device: auto
  rho_initial: 10.0
  rho_schedule:
    - 10.0
    - 30.0
    - 100.0
    - 300.0
  rho_patience_epochs: 25
  alpha_max: 1000.0
  gradient_clip_norm: 5.0
  save_top_alpha_count: 25
  final_bias_feasibility_repair: true
