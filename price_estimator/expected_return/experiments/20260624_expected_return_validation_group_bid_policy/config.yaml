experiment_id: 20260624_expected_return_validation_group_bid_policy

objective:
  min_coverage: 0.70
  target_validation_sum_pnl: 200.0

baseline:
  experiment_id: 20260619_expected_return_h13_h2_gc_gt_0p60
  source: price_estimator/expected_return/experiments/20260619_expected_return_h13_h2_gc_gt_0p60/reports/min_ev_search.csv
  row_filter: min_ev == 0.0
  validation_sum_pnl: 51.69

paths:
  train_dataset: price_estimator/expected_return/experiments/20260619_expected_return_trade_coverage_start/data/expected_return_train.parquet
  validation_dataset: price_estimator/expected_return/experiments/20260619_expected_return_trade_coverage_start/data/expected_return_validation.parquet
  reports_dir: price_estimator/expected_return/experiments/20260624_expected_return_validation_group_bid_policy/reports

policy_search:
  selection_source: validation
  bid_min: 0.01
  bid_max: 0.90
  bid_step: 0.01
  min_group_count: 10
  min_group_pnl: 0.0
  p_side_bins: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 1.01]
  group_candidates:
    - [selected_side]
    - [hour]
    - [dow]
    - [session]
    - [p_side_bin]
    - [selected_side, hour]
    - [selected_side, dow]
    - [selected_side, p_side_bin]
    - [hour, dow]
    - [hour, p_side_bin]
    - [dow, p_side_bin]
    - [selected_side, hour, dow]
    - [selected_side, hour, p_side_bin]
    - [selected_side, dow, p_side_bin]
    - [hour, dow, p_side_bin]

metadata:
  deploy_training_mode: validation_policy_search_diagnostic
  offline_validation_metric_source: execution_engine/deploy/baseline/artifact_manifest.json
