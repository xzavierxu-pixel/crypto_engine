experiment_id: 20260625_expected_return_xgb_catboost_blend_lowbid_group_no_leak

objective:
  min_coverage: 0.70
  target_validation_sum_pnl: 1000.0

baseline:
  experiment_id: 20260625_expected_return_catboost_lowbid_group_no_leak
  source: price_estimator/expected_return/experiments/20260625_expected_return_catboost_lowbid_group_no_leak/reports/summary_metrics.json
  row_filter: validation_metrics
  validation_sum_pnl: 948.75

paths:
  train_dataset: price_estimator/expected_return/experiments/20260619_expected_return_trade_coverage_start/data/expected_return_train.parquet
  validation_dataset: price_estimator/expected_return/experiments/20260619_expected_return_trade_coverage_start/data/expected_return_validation.parquet
  reports_dir: price_estimator/expected_return/experiments/20260625_expected_return_xgb_catboost_blend_lowbid_group_no_leak/reports

split:
  calibration_tail_days: 7
  timestamp_column: timestamp

features:
  forbidden_columns:
    - target
    - future_close
    - abs_return
    - signed_return
    - stage1_target
    - stage2_target
    - lowest_trade_price_next4
    - lowest_trade_time_next4
    - time_to_lowest_trade_sec
    - target_raw
    - chosen_low_next4
    - chosen_low_trade_time
    - chosen_low
    - correct
    - accepted
    - threshold_accepted
    - predicted_side
    - predicted_outcome
    - chosen_low_reason

policy_search:
  bid_min: 0.01
  bid_max: 0.91
  bid_step: 0.05
  bid_offset_steps_grid: [-4, -3, -2, -1, 0, 1]
  min_ev_grid: [-0.25, -0.245, -0.24, -0.235, -0.23, -0.225, -0.22, -0.215, -0.21, -0.205, -0.20, -0.195, -0.19, -0.185, -0.18, -0.175, -0.17, -0.165, -0.16, -0.155, -0.15, -0.145, -0.14, -0.135, -0.13, -0.125, -0.12, -0.115, -0.11, -0.105, -0.10, -0.095, -0.09, -0.085, -0.08, -0.075, -0.07, -0.065, -0.06, -0.055, -0.05, -0.045, -0.04, -0.035, -0.03, -0.025, -0.02, -0.015, -0.01, -0.005, 0.0, 0.005, 0.01, 0.015, 0.02, 0.025, 0.03, 0.035, 0.04, 0.045, 0.05, 0.055, 0.06, 0.065, 0.07, 0.075, 0.08, 0.085, 0.09, 0.095, 0.10, 0.105, 0.11, 0.115, 0.12, 0.125, 0.13, 0.135, 0.14, 0.145, 0.15, 0.155, 0.16, 0.165, 0.17, 0.175, 0.18, 0.185, 0.19, 0.195, 0.20]
  min_order_count: 20
  group_min_ev:
    enabled: true
    min_group_order_count: 20
    p_side_bins: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 1.01]
    group_candidates:
      - [selected_side]
      - [hour]
      - [p_side_bin]
      - [selected_side, hour]
      - [selected_side, p_side_bin]
      - [hour, p_side_bin]

model:
  family: blend
  blend_weight_grid: [0.0, 0.25, 0.50, 0.75, 1.0]
  members:
    - family: xgboost
      n_estimators: 180
      learning_rate: 0.04
      max_depth: 4
      subsample: 0.80
      colsample_bytree: 0.45
      min_child_weight: 20
      reg_lambda: 5.0
      random_state: 909
      n_jobs: -1
      tree_method: hist
      isotonic_q: true
      isotonic_gc: true
    - family: catboost
      iterations: 300
      learning_rate: 0.04
      depth: 4
      l2_leaf_reg: 5.0
      random_state: 909
      n_jobs: -1
      early_stopping_rounds: 25
      isotonic_q: true
      isotonic_gc: true

metadata:
  deploy_training_mode: no_leak_validation_diagnostic
  offline_validation_metric_source: execution_engine/deploy/baseline/artifact_manifest.json
