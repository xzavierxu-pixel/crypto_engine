experiment_id: 20260619_expected_return_h11_h2_gc_blend

objective:
  min_coverage: 0.70

paths:
  h2_checkpoint: price_estimator/expected_return/experiments/20260619_expected_return_h2_hazard_smooth/models/hazard_survival_cdf.pt
  train_dataset: price_estimator/expected_return/experiments/20260619_expected_return_trade_coverage_start/data/expected_return_train.parquet
  validation_dataset: price_estimator/expected_return/experiments/20260619_expected_return_trade_coverage_start/data/expected_return_validation.parquet
  models_dir: price_estimator/expected_return/experiments/20260619_expected_return_h11_h2_gc_blend/models
  reports_dir: price_estimator/expected_return/experiments/20260619_expected_return_h11_h2_gc_blend/reports
  predictions_train: price_estimator/expected_return/experiments/20260619_expected_return_h11_h2_gc_blend/reports/predictions_train.parquet
  predictions_policy_select: price_estimator/expected_return/experiments/20260619_expected_return_h11_h2_gc_blend/reports/predictions_policy_select.parquet
  predictions_validation: price_estimator/expected_return/experiments/20260619_expected_return_h11_h2_gc_blend/reports/predictions_validation.parquet

split:
  calibration_tail_days: 7
  timestamp_column: timestamp

target:
  tick_size: 0.01
  min_bid: 0.01
  min_ev_grid: [0.00, 0.01, 0.02, 0.03, 0.05]
  min_ev_min_order_count: 100

gc_calibration:
  method: blend
  p_side_bin_width: 0.05
  beta_prior: 1.0
  parameter_grid: [0.25, 0.50, 0.75]

evaluation:
  device: cpu
  batch_size: 512

backtest:
  wrong_fill_policy: forced
  pnl_scope: threshold_accepted_rows
