  - p_up
  - p_side
  - direction_confidence
  - p_bin
  - p_side_bucket
  - market_time_bucket
  categorical_columns:
  - selected_side
  - p_bin
  - p_side_bucket
  - market_time_bucket
  forbidden_columns:
  - target
  - future_close
  - abs_return
  - signed_return
  - stage1_target
  - stage2_target
