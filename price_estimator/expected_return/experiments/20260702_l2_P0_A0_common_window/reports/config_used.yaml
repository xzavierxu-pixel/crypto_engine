  - chosen_low
  - correct
  - accepted
  - threshold_accepted
  - predicted_side
  - predicted_outcome
  - chosen_low_reason
model:
  family: hazard_survival_cdf
  hidden_dims:
  - 256
  - 128
  - 64
  dropout:
