  - 0.05
  - 0.0
  hazard:
    tick_size: 0.01
    max_price: 0.85
    smoothness_penalty: 0.01
  q_calibration:
    enabled: false
training:
  batch_size: 512
  epochs: 45
  learning_rate: 0.001
  weight_decay: 0.0001
  random_seed: 42
  num_workers: 0
  device: auto
  gradient_clip_norm: 5.0
  early_stop_patience: 10
backtest:
