experiment_id: 20260618_expected_return_r9_residual_cdf

paths:
  deploy_artifact_dir: execution_engine/deploy/baseline
  feature_manifest: execution_engine/deploy/baseline/artifact_manifest.json
  train_dataset_source: price_estimator/data/price_estimator_train.parquet
  validation_dataset_source: price_estimator/data/price_estimator_valid.parquet
  trades_dir: price_estimator/data/sell_taker_trades_daily
  experiment_dir: price_estimator/expected_return/experiments/20260618_expected_return_r9_residual_cdf
  train_dataset: price_estimator/expected_return/experiments/20260618_expected_return_r9_residual_cdf/data/expected_return_train.parquet
  validation_dataset: price_estimator/expected_return/experiments/20260618_expected_return_r9_residual_cdf/data/expected_return_validation.parquet
  models_dir: price_estimator/expected_return/experiments/20260618_expected_return_r9_residual_cdf/models
  reports_dir: price_estimator/expected_return/experiments/20260618_expected_return_r9_residual_cdf/reports
  predictions_train: price_estimator/expected_return/experiments/20260618_expected_return_r9_residual_cdf/reports/predictions_train.parquet
  predictions_calibration: price_estimator/expected_return/experiments/20260618_expected_return_r9_residual_cdf/reports/predictions_calibration.parquet
  predictions_validation: price_estimator/expected_return/experiments/20260618_expected_return_r9_residual_cdf/reports/predictions_validation.parquet

target:
  selected_side_source: deploy_manifest_threshold_policy
  order_window: until_settlement
  include_start: false
  include_end: true
  eps: 0.01
  tick_size: 0.01
  fee: 0.0
  allow_negative_ev_bid: true
  min_bid: 0.01

split:
  calibration_tail_days: 31
  timestamp_column: timestamp

features:
  source: split_artifact_feature_columns
  added_columns:
    - selected_side
    - p_up
    - p_side
    - direction_confidence
    - p_bin
    - p_side_bucket
    - market_time_bucket
  categorical_columns:
    - selected_side
    - p_bin
    - p_side_bucket
    - market_time_bucket
  forbidden_columns:
    - target
    - future_close
    - abs_return
    - signed_return
    - stage1_target
    - stage2_target
    - lowest_trade_price_next4
    - lowest_trade_time_next4
    - time_to_lowest_trade_sec
    - target_raw
    - chosen_low_next4
    - chosen_low_trade_time
    - chosen_low
    - correct
    - accepted

model:
  family: r9_point_plus_global_residual_cdf
  hidden_dims:
    - 256
    - 128
    - 64
  dropout:
    - 0.10
    - 0.05
    - 0.00

training:
  batch_size: 512
  epochs: 45
  learning_rate: 0.001
  weight_decay: 0.0001
  random_seed: 42
  num_workers: 0
  device: auto
  gradient_clip_norm: 5.0
  early_stop_patience: 10

backtest:
  baselines:
    - expected_return
    - fixed_0p50_pside
    - fixed_0p75_pside
    - pay_pside
